name: Validar estoque
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estoque_ci
          POSTGRES_USER: postgres_ci
          POSTGRES_PASSWORD: apenas-no-ci-efemero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_ci -d estoque_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://estoque_ci:apenas-no-ci-efemero@127.0.0.1:5432/estoque_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock pytest
      - name: Criar papel de aplicação sem superusuário no banco efêmero
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres_ci:apenas-no-ci-efemero@127.0.0.1:5432/estoque_ci') as connection:
              connection.execute("CREATE ROLE estoque_ci LOGIN PASSWORD 'apenas-no-ci-efemero' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION")
              connection.execute('GRANT CONNECT ON DATABASE estoque_ci TO estoque_ci')
              connection.execute('GRANT USAGE, CREATE ON SCHEMA public TO estoque_ci')
          PY
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: docker build -t estoque-bc:ci .
