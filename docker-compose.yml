services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: estoque_brasilcacau
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - estoque_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estoque_brasilcacau"]
      interval: 5s
      retries: 10
volumes:
  estoque_pg:
