{% extends 'base.html' %}{% block title %}Movimentar{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">OPERAÇÃO DE ESTOQUE</div><h1>Operação interna</h1><p>Recebimentos, transferências e baixas internas. Para vendas, use Venda direta e selecione o cliente.</p></div><a class="btn secondary" href="{{ url_for('main.movements') }}">Ver histórico ↗</a></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="span-2">Produto *<select id="movement-product" name="product_id" required>{% for p in items %}<option value="{{ p.id }}" data-multiple="{{ p.sale_multiple }}" {{ 'selected' if selected == p.id }}>{{ p.sku }} · {{ p.name }} ({{ p.category }})</option>{% endfor %}</select></label><label>Operação *<select id="movement-kind" name="kind"><option value="entrada">Entrada externa</option><option value="transferencia">Transferir armazenado → loja</option><option value="perda">Perda / avaria / vencimento</option><option value="devolucao">Devolução à loja</option><option value="bonificacao">Bonificação / degustação / ação comercial</option></select></label><label>Quantidade em unidades *<input id="movement-quantity" name="quantity" type="number" min="1" max="1000000" required placeholder="0"></label><label>Origem *<select id="movement-source" name="source"><option value="">Externa / nenhuma</option><option value="LOJA">Loja</option><option value="ARMAZENADO">Armazenado</option></select></label><label>Destino *<select id="movement-destination" name="destination"><option value="">Externo / nenhum</option><option value="LOJA">Loja</option><option value="ARMAZENADO">Armazenado</option></select></label><label>Lote na entrada (opcional)<input name="lot_code" maxlength="80" placeholder="Identificação do lote"></label><label>Validade (obrigatória na entrada alimentar)<input type="date" name="expires_on"></label><label class="span-2">Motivo *<input name="reason" minlength="5" maxlength="300" required placeholder="Ex.: Reposição da vitrine, venda no caixa, avaria identificada"></label><label class="span-2">Referência (opcional)<input name="reference" maxlength="100" placeholder="Ex.: nota fiscal, pedido ou cupom"></label></div><div class="hint" id="movement-hint"></div><div class="hint" id="multiple-hint"></div><button class="btn primary" data-confirm="Registrar esta movimentação?">Registrar movimento →</button></form></section>{% endblock %}
